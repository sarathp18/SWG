<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <title>SWG Parallel Calculator</title>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #eef4fb; 
      margin: 0; 
      padding: 20px; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .calculator { 
      width: 100%;
      max-width: 360px; 
      height: 520px; 
      background: #fff; 
      border-radius: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
      position: relative;
      overflow: hidden;
    }

    .screen-container {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      height: 110px; 
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
      text-align: right;
    }

    #equation {
      height: 20px;
      color: #9e9e9e;
      font-size: 16px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    #main-display {
      color: #ffffff;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #expand-arrow {
      position: absolute;
      bottom: 10px;
      left: 16px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: none;
      padding: 5px;
      user-select: none;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #expanded-details {
      display: none;
      text-align: left;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #444;
      opacity: 0;
      max-height: 260px; 
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    #expanded-details::-webkit-scrollbar {
      display: none;
    }
    
    .nearest-swg {
      font-size: 21px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
    }
    
    .normal-text {
      font-size: 14px;
      color: #ffffff;
      margin-bottom: 2px;
      line-height: 1.4;
    }
    
    .error-text {
      color: #ef5350;
      font-size: 15px;
      text-align: center;
      margin-top: 20px;
    }

    .combinations-container {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #444;
    }
    
    .combo-title {
      color: #a5d6a7;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    
    .combo-item {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 14px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.05);
      padding: 5px 8px;
      border-radius: 6px;
    }
    
    .combo-item span:last-child {
      color: #ffffff;
    }
    
    .green-bracket { color: #a5d6a7; font-weight: bold; }
    .white-bracket { color: #ffffff; font-weight: bold; }

    @keyframes fadeIn { to { opacity: 1; } }

    .expanded-mode .screen-container { height: 400px; }
    .expanded-mode #expand-arrow { display: none !important; }
    .expanded-mode #expanded-details { display: block; animation: fadeIn 0.3s ease-in 0.1s forwards; }
    
    /* Hide all keypads when expanded */
    .expanded-mode .keypads { opacity: 0; pointer-events: none; transform: translateY(20px); }

    .scale-container { margin-top: 25px; position: relative; }
    .scale-line { width: 100%; height: 12px; border-bottom: 2px solid #a5d6a7; border-left: 2px solid #a5d6a7; border-right: 2px solid #a5d6a7; position: relative; }
    .scale-mid-tick { position: absolute; left: 50%; bottom: -2px; width: 2px; height: 6px; background: #a5d6a7; transform: translateX(-50%); }
    .scale-marker { position: absolute; top: -14px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid #fff; transform: translateX(-50%); z-index: 2; }
    .scale-labels { display: flex; justify-content: space-between; margin-top: 6px; color: #fff; font-size: 14px; font-weight: bold; }

    /* Keypad Section */
    .keypads {
      position: absolute;
      top: 145px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.2s, transform 0.3s;
      z-index: 1;
    }

    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    
    button {
      background: #f0f4f8; 
      border: none; 
      border-radius: 12px; 
      font-size: 24px;
      font-weight: 600; 
      color: #333; 
      height: 52px; 
      cursor: pointer; 
      user-select: none;
      transition: all 0.1s ease-in-out;
    }
    
    /* Standard numbers */
    button:active { transform: scale(0.95); background: #333; color: #fff; }
    
    /* Color Inversion for Special Buttons */
    .btn-clear { font-size: 18px; color: #d32f2f; }
    .btn-clear:active { background: #d32f2f !important; color: #fff !important; }
    
    .btn-operator { background: #1976d2; color: #fff; font-size: 28px; }
    .btn-operator:active { background: #fff !important; color: #1976d2 !important; }
    
    .btn-calculate { background: #2e7d32; color: #fff; font-size: 28px; }
    .btn-calculate:active { background: #fff !important; color: #2e7d32 !important; }
    
    .btn-backspace { font-size: 20px; }

    /* The big close button shown only when expanded */
    .btn-close { 
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1976d2; 
      color: #fff; 
      font-size: 20px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      z-index: 3;
      height: 56px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      display: none;
    }
    .btn-close:active { filter: brightness(0.8); }
    .expanded-mode .btn-close { display: block; animation: fadeIn 0.3s ease-in forwards; }
  </style>
</head>
<body>

  <div class="calculator" id="calc-app">
    
    <div class="screen-container" id="screen">
      <div id="equation"></div>
      <div id="main-display">0</div>
      <div id="expand-arrow" onclick="expandScreen()">▼</div>
      <div id="expanded-details"></div>
    </div>

    <div class="keypads">
      <div class="grid-3x3">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
      </div>
      <div class="grid-3x2">
        <button onclick="press('C')" class="btn-clear">Clear</button>
        <button onclick="press('0')">0</button>
        <button onclick="press('BACK')" class="btn-backspace">⌫</button>
        <button onclick="press('+')" class="btn-operator">+</button>
        <button onclick="press('-')" class="btn-operator">-</button>
        <button onclick="press('=')" class="btn-calculate">=</button>
      </div>
    </div>

    <button class="btn-close" onclick="closeScreen()">CLOSE</button>
  </div>

  <script>
    const MILS = {
      1: 300, 2: 276, 3: 252, 4: 232, 5: 212, 6: 192, 7: 176, 8: 160, 9: 144, 10: 128,
      11: 116, 12: 104, 13: 92, 14: 80, 15: 72, 16: 64, 17: 56, 18: 48, 19: 40, 20: 36,
      21: 32, 22: 28, 23: 24, 24: 22, 25: 20, 26: 18, 27: 16.4, 28: 14.8, 29: 13.6, 30: 12.4,
      31: 11.6, 32: 10.8, 33: 10.0, 34: 9.2, 35: 8.4, 36: 7.6, 37: 6.8, 38: 6.0, 39: 5.2, 40: 4.8,
      41: 4.4, 42: 4.0, 43: 3.6, 44: 3.2, 45: 2.8, 46: 2.4, 47: 2.0, 48: 1.6, 49: 1.2, 50: 1.0
    };

    let tokens = []; 
    let currentNum = "";
    let justCalculated = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const eqDisplay = document.getElementById('equation');
    const mainDisplay = document.getElementById('main-display');
    const arrowIcon = document.getElementById('expand-arrow');
    const calcApp = document.getElementById('calc-app');

    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.02);
      oscGain.gain.setValueAtTime(1, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.02);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function vibratePhone() {
      if (navigator.vibrate) navigator.vibrate(40); 
    }

    function updateScreen() {
      let eqString = tokens.join(" ");
      if (currentNum !== "" && tokens.length > 0) eqString += " " + currentNum;
      else if (currentNum !== "") eqString = currentNum;
      
      eqDisplay.innerText = eqString;
      
      if (!justCalculated) {
        if (currentNum !== "") {
          mainDisplay.innerText = currentNum;
        } else if (tokens.length > 0) {
          let last = tokens[tokens.length - 1];
          if (last === '+' || last === '-') {
            mainDisplay.innerText = tokens.length > 1 ? tokens[tokens.length - 2] : "0";
          } else {
            mainDisplay.innerText = last;
          }
        } else {
          mainDisplay.innerText = "0";
        }
      }
    }

    function expandScreen() {
      vibratePhone();
      calcApp.classList.add('expanded-mode');
    }

    function closeScreen() {
      vibratePhone();
      calcApp.classList.remove('expanded-mode');
      if (justCalculated && tokens.length > 0) {
        arrowIcon.style.display = 'block';
      }
    }

    function press(val) {
      vibratePhone();
      playClickSound();
      
      closeScreen(); 

      if (justCalculated && val !== '=' && val !== '+' && val !== '-' && val !== 'BACK') {
        tokens = []; currentNum = ""; justCalculated = false; arrowIcon.style.display = 'none';
      }

      if (val === 'C') {
        currentNum = ""; tokens = []; justCalculated = false; arrowIcon.style.display = 'none';
        updateScreen(); return;
      }

      if (val === 'BACK') {
        justCalculated = false; arrowIcon.style.display = 'none';
        if (currentNum.length > 0) {
          currentNum = currentNum.slice(0, -1);
        } else if (tokens.length > 0) {
          let last = tokens.pop();
          if (last === '+' || last === '-') {
            currentNum = tokens.length > 0 ? tokens.pop().toString() : "";
          } else {
            currentNum = last.toString().slice(0, -1);
          }
        }
        updateScreen(); return;
      }

      if (val === '+' || val === '-') {
        if (currentNum !== "") { 
          tokens.push(parseInt(currentNum)); 
          tokens.push(val); 
          currentNum = ""; 
        } else if (tokens.length > 0) {
          let last = tokens[tokens.length - 1];
          if (last === '+' || last === '-') tokens[tokens.length - 1] = val; 
          else tokens.push(val);
        }
        justCalculated = false; arrowIcon.style.display = 'none';
        updateScreen(); return;
      }

      if (val === '=') {
        if (currentNum !== "") { tokens.push(parseInt(currentNum)); currentNum = ""; }
        if (tokens.length > 0 && (tokens[tokens.length - 1] === '+' || tokens[tokens.length - 1] === '-')) {
          tokens.pop();
        }
        updateScreen();
        if (tokens.length > 0) calculateResults();
        return;
      }

      if (currentNum.length < 2) { currentNum += val; updateScreen(); }
    }

    function getEquivalentDecimalSWG(sqMils) {
      let de_mils = Math.sqrt(sqMils);
      if (de_mils >= MILS[1]) return 1;
      if (de_mils <= MILS[50]) return 50;
      for (let g = 1; g < 50; g++) {
        if (de_mils <= MILS[g] && de_mils >= MILS[g+1]) {
          let area_upper = MILS[g] * MILS[g];
          let area_lower = MILS[g+1] * MILS[g+1];
          let fraction = (area_upper - sqMils) / (area_upper - area_lower);
          return g + fraction;
        }
      }
      return 0;
    }

    function getPriority(w1, w2) {
      let minW = Math.min(w1, w2);
      let maxW = Math.max(w1, w2);
      if (minW >= 20 && maxW <= 30) return 1;
      if (minW >= 11 && maxW <= 40) return 2;
      return 3;
    }

    function renderError(msg) {
      // Displays error on screen WITHOUT enlarging
      mainDisplay.innerText = "Error";
      eqDisplay.innerText = msg;
      arrowIcon.style.display = 'none';
      document.getElementById('expanded-details').innerHTML = ""; // Clear old details
      justCalculated = true;
    }

    function showDetails(html, autoExpand) {
      document.getElementById('expanded-details').innerHTML = html;
      justCalculated = true;
      if (autoExpand) {
        setTimeout(expandScreen, 50);
      } else {
        arrowIcon.style.display = 'block';
      }
    }

    function calculateResults() {
      let outputHTML = "";
      
      for (let i = 0; i < tokens.length; i += 2) {
        let g = tokens[i];
        if (!MILS[g]) return renderError(`SWG ${g} unsupported (1-50)`);
      }

      // Mode 1: Combinations (e.g., 25 =) -> Auto-expands
      if (tokens.length === 1) {
        let targetGauge = tokens[0];
        let targetSqMils = MILS[targetGauge] * MILS[targetGauge];
        let combos = [];
        
        for (let i = 1; i <= 50; i++) {
          for (let j = i; j <= 50; j++) {
            if (i === targetGauge || j === targetGauge) continue;
            let sumSq = (MILS[i] * MILS[i]) + (MILS[j] * MILS[j]);
            let eqDec = getEquivalentDecimalSWG(sumSq);
            let diffSq = Math.abs(sumSq - targetSqMils);
            
            if (Math.abs(targetGauge - eqDec) <= 0.5) {
              combos.push({ w1: i, w2: j, diff: diffSq, eqDec: eqDec, priority: getPriority(i, j) });
            }
          }
        }
        
        combos.sort((a, b) => {
          return Math.abs(targetGauge - a.eqDec) - Math.abs(targetGauge - b.eqDec);
        });

        let de_mm = Math.sqrt(targetSqMils) * 0.0254;
        let area_mm2 = Math.PI * (de_mm * de_mm) / 4;
        
        outputHTML += `
          <div class="normal-text">Diameter : ${de_mm.toFixed(3)} mm</div>
          <div class="normal-text">Area : ${area_mm2.toFixed(3)} mm²</div>
          <div class="combinations-container">
            <div class="combo-title">Top Combinations:</div>
        `;
        
        let displayCount = Math.min(15, combos.length);
        if (displayCount === 0) {
            outputHTML += `<div class="normal-text" style="color:#ffb74d;">No close combinations found</div>`;
        } else {
            for (let k = 0; k < displayCount; k++) {
              let eqDec = combos[k].eqDec.toFixed(2);
              let comboNear = Math.round(combos[k].eqDec);
              let diff = Math.abs(targetGauge - combos[k].eqDec);
              let bracketClass = diff < 0.1 ? 'green-bracket' : 'white-bracket';
              
              outputHTML += `
                <div class="combo-item">
                  <span>${combos[k].w1} + ${combos[k].w2}</span>
                  <span>≈ swg ${comboNear} <span class="${bracketClass}">[${eqDec}]</span></span>
                </div>
              `;
            }
        }
        outputHTML += `</div>`;
        mainDisplay.innerText = targetGauge; 
        
        showDetails(outputHTML, true); // Auto-expands
        return;
      }
      
      // Mode 2: Subtraction (e.g., 25 - 28 =) -> Auto-expands
      if (tokens.includes('-')) {
        if (tokens.length !== 3 || tokens[1] !== '-') return renderError("Use format: Target - Given");
        
        let targetA = tokens[0], givenB = tokens[2];
        let areaA = MILS[targetA] * MILS[targetA];
        let areaB = MILS[givenB] * MILS[givenB];
        
        if (areaA <= areaB) return renderError(`SWG ${targetA} must be thicker than SWG ${givenB}`);
        
        let results = [];
        
        for (let i = 1; i <= 50; i++) {
          if (i === targetA) continue;
          let testArea = areaB + (MILS[i] * MILS[i]);
          let eqDec = getEquivalentDecimalSWG(testArea);
          let diffSq = Math.abs(testArea - areaA);
          
          if (Math.abs(targetA - eqDec) <= 0.5) {
            results.push({ w1: givenB, w2: i, diffSq: diffSq, eqDec: eqDec, priority: getPriority(givenB, i) });
          }
        }
        
        results.sort((a, b) => {
          return Math.abs(targetA - a.eqDec) - Math.abs(targetA - b.eqDec);
        });
        
        outputHTML += `
          <div class="combinations-container">
            <div class="combo-title">To make SWG ${targetA}, add to SWG ${givenB}:</div>
        `;
        
        let displayCount = Math.min(15, results.length);
        if (displayCount === 0) {
            outputHTML += `<div class="normal-text" style="color:#ffb74d;">No close combinations found</div>`;
        } else {
            for (let k = 0; k < displayCount; k++) {
              let eqDec = results[k].eqDec.toFixed(2);
              let diff = Math.abs(targetA - results[k].eqDec);
              let bracketClass = diff < 0.1 ? 'green-bracket' : 'white-bracket'; 
              
              outputHTML += `
                <div class="combo-item">
                  <span>${results[k].w1} + ${results[k].w2}</span>
                  <span>≈ swg ${Math.round(results[k].eqDec)} <span class="${bracketClass}">[${eqDec}]</span></span>
                </div>
              `;
            }
        }
        outputHTML += `</div>`;
        mainDisplay.innerText = targetA;
        
        showDetails(outputHTML, true); // Auto-expands
        return;
      }

      // Mode 3: Addition Scale (e.g., 25 + 25 =) -> Does NOT auto-expand
      let sumSqMils = 0;
      for (let i = 0; i < tokens.length; i += 2) {
        sumSqMils += (MILS[tokens[i]] * MILS[tokens[i]]);
      }

      let de_mils = Math.sqrt(sumSqMils);
      if (de_mils > MILS[1]) return renderError("Thicker than SWG 1");
      if (de_mils < MILS[50]) return renderError("Thinner than SWG 50");

      let dec = getEquivalentDecimalSWG(sumSqMils);
      let lower = Math.floor(dec), upper = Math.ceil(dec);
      if (lower === upper) upper = lower + 1;
      let progress = (dec - lower) * 100;
      let de_mm = de_mils * 0.0254;

      outputHTML = `
        <div class="nearest-swg">Nearest SWG : ${Math.round(dec)}</div>
        <div class="normal-text">Equivalent swg : ${dec.toFixed(4)}</div>
        <div class="normal-text">Diameter : ${de_mm.toFixed(3)} mm</div>
        <div class="scale-container">
          <div class="scale-line">
            <div class="scale-mid-tick"></div>
            <div class="scale-marker" style="left: ${progress}%;"></div>
          </div>
          <div class="scale-labels">
            <span>${lower}</span>
            <span>${upper}</span>
          </div>
        </div>
      `;
      mainDisplay.innerText = dec.toFixed(2); 
      showDetails(outputHTML, false); // Does not auto-expand
    }
  </script>
</body>
</html>
